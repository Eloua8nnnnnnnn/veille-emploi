# Lance le robot chaque matin sur les serveurs de GitHub, puis publie les offres mises à jour.
name: Veille emploi quotidienne

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 5 h UTC, soit 6 h (hiver) ou 7 h (été) à Paris
  workflow_dispatch:       # permet aussi de le lancer à la main depuis l'onglet « Actions »

permissions:
  contents: write          # pour enregistrer docs/offres.json dans le dépôt

jobs:
  veille:
    runs-on: ubuntu-24.04   # version fixe : Playwright ne gère pas encore Ubuntu 26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les bibliothèques
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium   # navigateur pour les offres VIE

      - name: Lancer le robot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFIL: ${{ secrets.PROFIL }}
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}             # boîte qui reçoit les alertes emploi
          GMAIL_MOT_DE_PASSE: ${{ secrets.GMAIL_MOT_DE_PASSE }}   # mot de passe d'application Gmail
          GMAIL_LIBELLE: ${{ secrets.GMAIL_LIBELLE }}             # facultatif
        run: python robot.py

      - name: Publier les offres mises à jour
        run: |
          git config user.name "robot-veille"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/offres.json startups_suivies.json
          git diff --staged --quiet || git commit -m "Mise à jour des offres du $(date +%d/%m/%Y)"
          git push
