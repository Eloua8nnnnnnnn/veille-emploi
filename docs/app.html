<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<!--
  Dashboard personnel. Servi par Google (Apps Script, accès réservé au compte d'Elouan) : les données
  viennent du Google Sheet par google.script.run. Ouvert ailleurs (aperçu sur l'ordinateur), il affiche
  des données fictives. Ce fichier est public sur GitHub : il ne doit contenir aucune donnée personnelle.
-->
<style>
  :root {
    --fond: #e9edf7; --panneau: #ffffff; --texte: #1f1f1e; --discret: #6e6d69; --bord: #ececf2;
    --barre: #26215c; --barre-icone: #cecbf6; --barre-actif: #3c3489;
    --bleu: #0c447c; --bleu-fond: #e6f1fb; --bleu-moyen: #185fa5;
    --violet: #3c3489; --violet-fond: #eeedfe; --violet-moyen: #534ab7;
    --vert: #085041; --vert-fond: #e1f5ee; --vert-moyen: #0f6e56;
    --creme: #633806; --creme-fond: #faeeda; --creme-moyen: #854f0b;
    --rose: #72243e; --rose-fond: #fbeaf0; --rose-moyen: #993556;
    --ok: #3b6d11;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #0f0e1a; --panneau: #17161f; --texte: #ececea; --discret: #a3a29e; --bord: #2a2935;
      --barre: #1c1940; --barre-actif: #3c3489;
      --bleu: #b5d4f4; --bleu-fond: #0c2f52; --bleu-moyen: #85b7eb;
      --violet: #cecbf6; --violet-fond: #2c2768; --violet-moyen: #afa9ec;
      --vert: #9fe1cb; --vert-fond: #0b3d31; --vert-moyen: #5dcaa5;
      --creme: #fac775; --creme-fond: #4a2c05; --creme-moyen: #ef9f27;
      --rose: #f4c0d1; --rose-fond: #561b2f; --rose-moyen: #ed93b1;
      --ok: #97c459;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--fond); color: var(--texte); font-family: "Poppins", system-ui, sans-serif; font-size: 15px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .cadre { display: flex; gap: 14px; min-height: 100vh; padding: 14px; }

  /* Barre de navigation : à gauche sur ordinateur, en bas sur téléphone */
  nav { background: var(--barre); border-radius: 26px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; position: sticky; top: 14px; height: calc(100vh - 28px); }
  nav .logo { width: 42px; height: 42px; border-radius: 13px; background: #faeeda; color: #633806; display: grid; place-items: center; font-weight: 600; margin-bottom: 14px; }
  nav button { width: 46px; height: 46px; border: 0; border-radius: 14px; background: none; color: var(--barre-icone); display: grid; place-items: center; }
  nav button svg { width: 22px; height: 22px; }
  nav button.actif { background: var(--barre-actif); color: #fff; }
  nav button span { display: none; }

  main { flex: 1; min-width: 0; background: var(--panneau); border-radius: 26px; padding: 26px 28px 32px; }
  .entete { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
  .discret { color: var(--discret); font-size: 13px; }
  .droite { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
  .pastille { font-size: 13px; padding: 7px 14px; border-radius: 999px; background: var(--fond); }
  .demo { font-size: 12px; padding: 6px 12px; border-radius: 999px; background: var(--creme-fond); color: var(--creme); }

  /* Cartes de couleur */
  .cartes { display: grid; grid-template-columns: 1.2fr repeat(3, 1fr); gap: 14px; margin-bottom: 26px; }
  .carte { border: 0; text-align: left; border-radius: 20px; padding: 16px 18px; min-height: 128px; display: flex; flex-direction: column; justify-content: space-between; }
  .carte .etiquette { font-size: 13px; }
  .carte .valeur { font-size: 24px; font-weight: 600; margin: 4px 0; }
  .carte .detail { font-size: 12px; }
  .carte.bientot .valeur { font-size: 15px; font-weight: 500; }
  .c-bleu { background: var(--bleu-fond); color: var(--bleu); } .c-bleu .etiquette, .c-bleu .detail { color: var(--bleu-moyen); }
  .c-violet { background: var(--violet-fond); color: var(--violet); } .c-violet .etiquette, .c-violet .detail { color: var(--violet-moyen); }
  .c-vert { background: var(--vert-fond); color: var(--vert); } .c-vert .etiquette, .c-vert .detail { color: var(--vert-moyen); }
  .c-creme { background: var(--creme-fond); color: var(--creme); } .c-creme .etiquette, .c-creme .detail { color: var(--creme-moyen); }
  .c-rose { background: var(--rose-fond); color: var(--rose); } .c-rose .etiquette, .c-rose .detail { color: var(--rose-moyen); }
  .jauge { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.6); overflow: hidden; }
  .jauge div { height: 100%; background: currentColor; border-radius: 3px; }

  .bas { display: grid; grid-template-columns: 1fr 1fr 0.9fr; gap: 18px; align-items: start; }
  .bloc-titre { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .bloc-titre h2 { margin: 0; }
  .segments { display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--bord); }
  .segments button { border: 0; background: none; font-size: 12px; padding: 5px 12px; border-radius: 999px; color: var(--discret); }
  .segments button.actif { background: var(--barre); color: #fff; }
  .case { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--violet-moyen); background: none; display: grid; place-items: center; padding: 0; }
  .case.cochee { background: var(--violet-moyen); }
  .case.cochee::after { content: ""; width: 9px; height: 5px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
  .ligne .nom { flex: 1; min-width: 0; }
  .ligne.faite .nom { text-decoration: line-through; color: var(--discret); }
  .serie { font-size: 11px; color: var(--violet-moyen); white-space: nowrap; }
  .points { display: flex; gap: 3px; }
  .points i { width: 6px; height: 6px; border-radius: 50%; background: var(--bord); }
  .points i.ok { background: var(--violet-moyen); }
  .retirer { border: 0; background: none; color: var(--discret); font-size: 18px; line-height: 1; padding: 0 4px; }
  .lien { border: 0; background: none; padding: 10px 0 0; font-size: 13px; color: var(--violet-moyen); }
  .ajout { display: flex; gap: 8px; margin: 10px 0 4px; }
  .ajout input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--texte); background: none; border: 1px solid var(--bord); border-radius: 999px; padding: 9px 14px; outline: none; }
  .ajout input:focus { border-color: var(--violet-moyen); }
  .ajout button { border: 0; border-radius: 999px; padding: 0 16px; background: var(--barre); color: #fff; font-size: 13px; }
  .onglets-social { display: flex; gap: 4px; padding: 5px; border: 1px solid var(--bord); border-radius: 999px; margin-bottom: 20px; }
  .onglets-social button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 10px 12px; font-size: 14px; font-weight: 500; color: var(--discret); }
  .onglets-social button.actif { background: var(--barre); color: #fff; }
  .compteur-onglet:not(:empty) { margin-left: 4px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--creme-fond); color: var(--creme); }
  .carte-ajout { border: 1px dashed var(--bord); border-radius: 18px; padding: 12px 16px; margin-bottom: 16px; }
  .carte-ajout summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--violet-moyen); list-style: none; }
  .carte-ajout summary::-webkit-details-marker { display: none; }
  .formulaire-ajout { display: grid; grid-template-columns: 1.2fr 1.2fr 1fr auto; gap: 10px; align-items: end; margin-top: 12px; }
  .formulaire-ajout label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--discret); }
  .formulaire-ajout input, .formulaire-ajout select { font: inherit; font-size: 14px; color: var(--texte); background: none; border: 1px solid var(--bord);
    border-radius: 12px; padding: 9px 12px; outline: none; }
  .formulaire-ajout input:focus, .formulaire-ajout select:focus { border-color: var(--violet-moyen); }
  .formulaire-ajout button { border: 0; border-radius: 999px; padding: 11px 20px; background: var(--barre); color: #fff; font-size: 14px; }
  .grille-cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .personne { border: 1px solid var(--bord); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .personne .haut { display: flex; align-items: center; gap: 12px; }
  .personne .nom-personne { font-size: 15px; font-weight: 600; }
  .personne .haut .badge-relance { margin-left: auto; }
  .personne .rangee { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--discret); flex-wrap: wrap; }
  .personne .prevue { font-size: 13px; background: var(--violet-fond); color: var(--violet); border-radius: 12px; padding: 8px 12px; }
  .personne .actions-idee { margin-top: auto; }
  .avec { font: inherit; font-size: 12px; color: var(--texte); background: none; border: 1px solid var(--bord); border-radius: 999px; padding: 6px 10px; flex-basis: 100%; }
  .idee .actions-idee { flex-wrap: wrap; }
  .avec.choisi { background: var(--violet-fond); border-color: transparent; color: var(--violet); }
  .theatre { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; align-items: start; }
  .barre-idees { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .bouton-idees { border: 0; border-radius: 999px; padding: 10px 18px; background: var(--violet-fond); color: var(--violet); font-size: 14px; font-weight: 500; }
  .theatre h3 { font-size: 15px; font-weight: 600; margin: 0; }
  .piece { border: 1px solid var(--bord); border-radius: 16px; padding: 12px 14px; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .piece .titre-idee { font-size: 15px; font-weight: 500; }
  .piece.reco { background: var(--violet-fond); border-color: transparent; }
  .piece.reco .pourquoi { font-size: 13px; color: var(--violet); }
  .piece.reco .petit-bouton { background: var(--panneau); border-color: transparent; }
  .piece a { font-size: 12px; color: var(--violet-moyen); }
  .etoiles { display: flex; gap: 2px; }
  .etoiles button { border: 0; background: none; padding: 0 1px; font-size: 18px; line-height: 1; color: var(--bord); }
  .etoiles button.pleine { color: #ef9f27; }
  .initiales { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--vert-fond); color: var(--vert); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .detail-contact { font-size: 12px; color: var(--discret); }
  .activite { border: 0; margin-left: 6px; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--vert-fond); color: var(--vert); vertical-align: 1px; }
  .activite.vide-activite { background: none; color: var(--discret); padding: 2px 4px; }
  .activite { font-size: 12px; padding: 3px 10px; }
  .badge-relance { font-size: 11px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--creme-fond); color: var(--creme); }
  .badge-ok { background: var(--vert-fond); color: var(--vert); }
  .petit-bouton { border: 1px solid var(--bord); background: none; border-radius: 999px; padding: 5px 12px; font-size: 12px; white-space: nowrap; }
  .petit-bouton:hover { border-color: var(--violet-moyen); color: var(--violet-moyen); }
  .ajout select { font: inherit; font-size: 13px; color: var(--texte); background: none; border: 1px solid var(--bord); border-radius: 999px; padding: 0 12px; }
  .ajout-activite { flex-wrap: wrap; }
  .ajout-activite #titre-activite { flex-basis: 100%; }
  .filtres-cat { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .filtres-cat button { border: 1px solid var(--bord); background: none; border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--discret); }
  .filtres-cat button.actif { background: var(--barre); border-color: var(--barre); color: #fff; }
  .idees { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .idee { border: 1px solid var(--bord); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .idee .titre-idee { font-size: 14px; font-weight: 500; }
  .idee .actions-idee { display: flex; gap: 6px; align-items: center; margin-top: auto; }
  .idee a { font-size: 12px; color: var(--violet-moyen); }
  .cat { font-size: 11px; padding: 2px 9px; border-radius: 999px; align-self: flex-start; }
  details.faites summary { cursor: pointer; font-size: 13px; color: var(--discret); margin: 14px 0 8px; }
  @media (max-width: 1100px) { .theatre { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .formulaire-ajout { grid-template-columns: 1fr; } .onglets-social button { padding: 9px 6px; font-size: 13px; } }
  @media (max-width: 760px) {
    .ajout { flex-wrap: wrap; }
    .ajout input { flex-basis: 100%; }
    .ajout select { flex: 1; min-height: 38px; }
    .ajout button { min-height: 38px; }
  }
  @media (max-width: 1100px) { .bas { grid-template-columns: 1fr 1fr; } .bas .sombre { grid-column: 1 / -1; } }
  .ligne { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--bord); font-size: 14px; }
  .ligne .badge { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 999px; }
  .erreur-serveur { color: #a32d2d; }
  .vide { color: var(--discret); font-size: 14px; padding: 14px 0; border-top: 1px solid var(--bord); }
  .sombre { background: var(--barre); color: #eeedfe; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
  .sombre .petit { font-size: 12px; color: #afa9ec; }
  .sombre .titre { font-size: 17px; font-weight: 600; margin: 4px 0; }
  .sombre a { font-size: 13px; padding: 8px 14px; border-radius: 999px; background: #cecbf6; color: #26215c; text-decoration: none; display: inline-block; margin: 4px 6px 0 0; }
  .sombre a.contour { background: none; color: #eeedfe; border: 1px solid #7f77dd; }

  .page { display: none; }
  .page.visible { display: block; }
  .bientot-page { border-radius: 20px; padding: 28px; text-align: center; }
  iframe { width: 100%; height: 900px; border: 0; display: block; }
  #message { position: fixed; left: 16px; right: 16px; bottom: 24px; max-width: 520px; margin: 0 auto; padding: 14px 18px; border-radius: 16px; z-index: 10;
    background: var(--barre); color: #eeedfe; font-size: 14px; opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none; }
  #message.visible { opacity: 1; transform: none; }

  /* Téléphone : une colonne, barre de navigation en bas */
  @media (max-width: 760px) {
    .cadre { padding: 0; display: block; }
    main { border-radius: 0; padding: 20px 16px 110px; min-height: 100vh; }
    nav { position: fixed; z-index: 5; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); top: auto; height: auto;
      flex-direction: row; justify-content: space-around; gap: 0; padding: 7px 4px; border-radius: 22px; }
    nav .logo { display: none; }
    nav button { width: auto; height: auto; padding: 6px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
    nav button { min-width: 0; }
    nav button span { display: block; font-size: 9.5px; letter-spacing: -0.1px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    h1 { font-size: 22px; }
    .pastille { display: none; }
    .cartes { grid-template-columns: 1fr 1fr; gap: 10px; }
    .carte { min-height: 112px; padding: 14px; }
    .bas { grid-template-columns: 1fr; }
    #message { bottom: calc(96px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="cadre">
  <nav id="navigation"></nav>
  <main>
    <div class="entete">
      <div><h1 id="titre">Aujourd'hui</h1><div class="discret" id="date"></div></div>
      <div class="droite">
        <div style="display:flex; gap:8px; align-items:center"><span class="demo" id="demo" hidden>Aperçu : données fictives</span><span class="pastille">Elouan</span></div>
        <div class="discret" id="maj-offres"></div>
      </div>
    </div>

    <section class="page" id="page-accueil">
      <div class="cartes" id="cartes"></div>
      <div class="bas">
        <div class="bloc">
          <div class="bloc-titre"><h2>Ma journée</h2>
            <div class="segments" id="choix-jour"><button data-decalage="1">Hier</button><button data-decalage="0" class="actif">Aujourd'hui</button></div>
          </div>
          <div id="habitudes"><div class="vide">Chargement…</div></div>
          <button class="lien" id="gerer">Modifier mes habitudes</button>
          <form class="ajout" id="ajout-habitude" hidden><input id="nouvelle-habitude" placeholder="Nouvelle habitude, ex. Sport" maxlength="60"><button>Ajouter</button></form>
        </div>
        <div class="bloc">
          <div class="bloc-titre"><h2>À ne pas oublier</h2></div>
          <form class="ajout" id="ajout-tache"><input id="nouvelle-tache" placeholder="Ex. envoyer l'ordonnance à la mutuelle" maxlength="120"><button>Ajouter</button></form>
          <div id="taches"></div>
        </div>
        <div class="sombre" id="preparation"></div>
      </div>
    </section>

    <section class="page" id="page-emploi"><iframe id="cadre-emploi" title="Offres d'emploi" loading="lazy"></iframe></section>
    <section class="page" id="page-social">
      <div class="onglets-social" id="choix-social">
        <button data-vue="personnes" class="actif">Personnes <span class="compteur-onglet" id="nb-relances"></span></button>
        <button data-vue="sorties">Sorties</button>
      </div>

      <div id="vue-personnes">
        <details class="carte-ajout"><summary>+ Ajouter une personne</summary>
          <form class="formulaire-ajout" id="ajout-contact">
            <label>Nom<input id="nom-contact" placeholder="Ex. Benjamin France TV" maxlength="60"></label>
            <label>Activité à faire ensemble<input id="activite-contact" placeholder="Ex. running, ciné, un verre" maxlength="60"></label>
            <label>Rappel<select id="frequence-contact">
              <option value="0" selected>Juste y penser</option>
              <option value="7">Chaque semaine</option><option value="14">Toutes les 2 semaines</option>
              <option value="30">Chaque mois</option><option value="60">Tous les 2 mois</option>
              <option value="90">Tous les 3 mois</option><option value="180">Tous les 6 mois</option>
            </select></label>
            <button>Ajouter</button>
          </form>
        </details>
        <div class="grille-cartes" id="contacts"><div class="vide">Chargement…</div></div>
      </div>

      <div id="vue-sorties" hidden>
        <div class="barre-idees">
          <button class="bouton-idees" id="plus-idees">Plus d'idées avec Claude</button>
          <span class="discret">Nouvelles idées chaque lundi, pièces de théâtre le 1er et le 15.</span>
        </div>
        <details class="carte-ajout"><summary>+ Ajouter une idée de sortie</summary>
          <form class="formulaire-ajout" id="ajout-activite">
            <label>Idée<input id="titre-activite" placeholder="Ex. expo à la Bourse de Commerce" maxlength="100"></label>
            <label>Catégorie<select id="categorie-activite"></select></label>
            <label>Lieu (facultatif)<input id="lieu-activite" placeholder="Ex. Paris 1er" maxlength="60"></label>
            <button>Ajouter</button>
          </form>
        </details>
        <div class="filtres-cat" id="categories"></div>
        <div id="activites"><div class="vide">Chargement…</div></div>
      <div class="theatre" id="vue-theatre" hidden>
        <div>
          <div class="bloc-titre"><h3>À voir</h3><span class="discret" id="nb-a-voir"></span></div>
          <div id="a-voir"></div>
          <form class="ajout" id="ajout-piece">
            <input id="titre-piece" placeholder="Titre de la pièce" maxlength="100">
            <select id="statut-piece" aria-label="Statut"><option value="a_voir">À voir</option><option value="vue">Déjà vue</option></select>
            <button>Ajouter</button>
          </form>
        </div>
        <div>
          <div class="bloc-titre"><h3>Recommandations de Claude</h3></div>
          <div id="recos"></div>
        </div>
        <div>
          <div class="bloc-titre"><h3>Déjà vues</h3><span class="discret" id="nb-vues"></span></div>
          <div id="vues"></div>
        </div>
      </div>
      </div>

    </section>

    <section class="page" id="page-autre"><div class="bientot-page" id="bientot"></div></section>
  </main>
</div>

<script>
// ---------- Où sont les données ----------
// Servi par Google : les fonctions du script Google Sheet sont appelées avec google.script.run.
// Ailleurs (aperçu sur l'ordinateur) : données fictives, pour tester l'affichage.
const SITE = "https://eloua8nnnnnnnn.github.io/veille-emploi/";
const DANS_GOOGLE = !!(window.google && google.script && google.script.run);
const FAUX = { habitudes: ["Sport", "2 candidatures", "Travailler"], journal: {}, taches: [{ id: "1", titre: "Envoyer l'ordonnance à la mutuelle", faite: "" }] };
function fauxJour(date) {
  const avant = (n) => { const d = new Date(date + "T12:00:00"); d.setDate(d.getDate() - n); return jourLocal(d); };
  return { date, habitudes: FAUX.habitudes.map((nom, i) => {
    let serie = 0, n = FAUX.journal[date + "|" + nom] ? 0 : 1;
    while (FAUX.journal[avant(n) + "|" + nom] || (i === 0 && n < 5 && n > 0)) { serie++; n++; }
    return { nom, faite: !!FAUX.journal[date + "|" + nom], serie, quinzaine: Array.from({ length: 14 }, (_, k) => !!FAUX.journal[avant(13 - k) + "|" + nom] || (i === 0 && k > 8 && k < 13)) };
  }), taches: FAUX.taches.filter(t => !t.faite || t.faite === date) };
}
const FAUX_SOCIAL = { contacts: [
    { nom: "Paul", frequence: 30, dernier: "2026-10-08", note: "" }, { nom: "Léa", frequence: 14, dernier: "2026-11-18", note: "" },
    { nom: "Mamie", frequence: 7, dernier: "2026-11-10", note: "" } ], activites: [] };
function fauxSocial(date) {
  const ecart = d => d ? Math.round((new Date(date) - new Date(d)) / 86400000) : null;
  return { contacts: FAUX_SOCIAL.contacts.map(c => ({ ...c, ecart: ecart(c.dernier),
      retard: !c.frequence ? (c.dernier ? -100000 : 0) : c.dernier ? ecart(c.dernier) - c.frequence : c.frequence }))
    .sort((a, b) => b.retard - a.retard), activites: FAUX_SOCIAL.activites };
}
let FAUX_THEATRE = [
  { id: "1", titre: "Du charbon dans les veines", statut: "vue", lieu: "", vue: "", note: "5" },
  { id: "2", titre: "Passeport", statut: "vue", lieu: "", vue: "", note: "" },
  { id: "3", titre: "Exemple de recommandation", statut: "reco", lieu: "Un théâtre parisien", lien: "#", pourquoi: "Données fictives pour l'aperçu.", jusqua: "2027-01-31" },
];
const fauxTheatre = () => ({ pieces: FAUX_THEATRE.filter(p => p.statut !== "ecartee") });
const FICTIF = {
  theatre: () => fauxTheatre(),
  ajouterPiece: (piece) => { FAUX_THEATRE.push({ id: String(Date.now()), ...piece }); return fauxTheatre(); },
  changerPiece: (id, champs) => { Object.assign(FAUX_THEATRE.find(p => p.id === id), champs); return fauxTheatre(); },
  supprimerPiece: (id) => { FAUX_THEATRE = FAUX_THEATRE.filter(p => p.id !== id); return fauxTheatre(); },
  social: (date) => fauxSocial(date),
  ajouterContact: (nom, frequence, note, date) => {
    const c = FAUX_SOCIAL.contacts.find(x => x.nom === nom);
    if (c) { c.frequence = Number(frequence); c.note = note || c.note; } else FAUX_SOCIAL.contacts.push({ nom, frequence: Number(frequence), dernier: "", note });
    return fauxSocial(date);
  },
  contacte: (nom, date) => { FAUX_SOCIAL.contacts.find(c => c.nom === nom).dernier = date; return fauxSocial(date); },
  supprimerContact: (nom, date) => { FAUX_SOCIAL.contacts = FAUX_SOCIAL.contacts.filter(c => c.nom !== nom); return fauxSocial(date); },
  ajouterActivites: (liste, date) => { liste.forEach((a, i) => FAUX_SOCIAL.activites.push({ id: String(Date.now() + i), faite: "", ...a })); return fauxSocial(date); },
  activiteFaite: (id, faite, date) => { FAUX_SOCIAL.activites.find(a => a.id === id).faite = faite ? date : ""; return fauxSocial(date); },
  lierActivite: (id, nom, date) => { FAUX_SOCIAL.activites.find(a => a.id === id).avec = nom; return fauxSocial(date); },
  supprimerActivite: (id, date) => { FAUX_SOCIAL.activites = FAUX_SOCIAL.activites.filter(a => a.id !== id); return fauxSocial(date); },
  journee: (date) => fauxJour(date),
  cocherHabitude: (date, nom, faite) => { if (faite) FAUX.journal[date + "|" + nom] = true; else delete FAUX.journal[date + "|" + nom]; return fauxJour(date); },
  ajouterHabitude: (nom, date) => { if (!FAUX.habitudes.includes(nom)) FAUX.habitudes.push(nom); return fauxJour(date); },
  retirerHabitude: (nom, date) => { FAUX.habitudes = FAUX.habitudes.filter(h => h !== nom); return fauxJour(date); },
  ajouterTache: (titre, date) => { FAUX.taches.push({ id: String(Date.now()), titre, faite: "" }); return fauxJour(date); },
  cocherTache: (id, faite, date) => { FAUX.taches.find(t => t.id === id).faite = faite ? date : ""; return fauxJour(date); },
  supprimerTache: (id, date) => { FAUX.taches = FAUX.taches.filter(t => t.id !== id); return fauxJour(date); },
  accueil: () => ({ candidatures: 12, parEtat: { "Envoyé": 7, "Entretien": 2, "Refusé": 3 }, file: [
    { Entreprise: "Coast", Poste: "Business Operations Associate", Etat: "Prêt", CV: "#", Lettre: "#", Note: "CV et lettre en anglais" },
  ] }),
};
function messageErreur(erreur) {
  const texte = String(erreur && erreur.message || erreur);
  return /is not a function|n'est pas une fonction/.test(texte)
    ? "Le script Google n'est pas à jour : colle la dernière version dans Apps Script et redéploie « Dashboard »."
    : "Enregistrement impossible : " + texte;
}
function afficherErreur(zone, erreur) {
  const ancien = $(zone).querySelector(".erreur-serveur");
  if (ancien) ancien.remove();
  $(zone).insertAdjacentHTML("afterbegin", `<div class="vide erreur-serveur">${echapper(messageErreur(erreur))}</div>`);
}
function serveur(fonction, ...parametres) {
  return new Promise((ok, echec) => {
    if (!DANS_GOOGLE) return setTimeout(() => ok(FICTIF[fonction](...parametres)), 150);
    google.script.run.withSuccessHandler(ok).withFailureHandler(echec)[fonction](...parametres);
  });
}
const $ = id => document.getElementById(id);
const echapper = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  sante: '<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10C19.5 15.4 12 20 12 20z"/><path d="M8 12h2.5l1.2-2.2 1.6 4 1.2-1.8H17"/>',
  vetements: '<path d="M8.5 4 4 6.5 5.5 10l2-1V20h9V9l2 1L20 6.5 15.5 4a3.5 3.5 0 0 1-7 0z"/>',

const MODULES = [
  { id: "accueil", nom: "Aujourd'hui", court: "Accueil" },
  { id: "emploi", nom: "Emploi" },
  { id: "social", nom: "Social", texte: "Tes proches, les relances et les idées de sorties." },

];

$("navigation").innerHTML = '<div class="logo">E</div>' + MODULES.map(m =>
  `<button data-page="${m.id}" aria-label="${m.nom}" title="${m.nom}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[m.id]}</svg><span>${m.court || m.nom}</span></button>`).join("");
$("navigation").addEventListener("click", e => { const b = e.target.closest("button[data-page]"); if (b) ouvrir(b.dataset.page); });

function ouvrir(id) {
  const module = MODULES.find(m => m.id === id) || MODULES[0];
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("actif", b.dataset.page === module.id));
  $("titre").textContent = module.nom;
  document.querySelectorAll(".page").forEach(p => p.classList.remove("visible"));
  if (module.id === "accueil") $("page-accueil").classList.add("visible");
  else if (module.id === "social") { $("page-social").classList.add("visible"); chargerSocial(); chargerTheatre(); }
  else if (module.id === "emploi") {
    // « v » change à chaque ouverture : le navigateur charge toujours la dernière version (sinon il la garde 10 minutes)
    if (!$("cadre-emploi").src) $("cadre-emploi").src = (DANS_GOOGLE ? SITE : "index.html") + "?integre&v=" + Date.now();
    $("page-emploi").classList.add("visible");
  } else {
    $("bientot").innerHTML = `<h2>${echapper(module.nom)} arrive bientôt</h2><div class="discret">${echapper(module.texte)}</div>`;
    $("bientot").className = "bientot-page " + { social: "c-vert", sante: "c-creme", vetements: "c-rose", recettes: "c-violet" }[module.id];
    $("page-autre").classList.add("visible");
  }
  try { history.replaceState(null, "", "#" + module.id); } catch {}
  window.scrollTo(0, 0);
}

// ---------- Accueil ----------
function carte(couleur, page, etiquette, valeur, detail, extra = "") {
  return `<button class="carte ${couleur}${valeur ? "" : " bientot"}" data-page="${page}"><div class="etiquette">${etiquette}</div>
    <div><div class="valeur">${valeur || "Bientôt"}</div>${extra}</div><div class="detail">${detail}</div></button>`;
}

async function chargerAccueil() {
  $("date").textContent = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  $("demo").hidden = DANS_GOOGLE;
  let offres = null, donnees = null;
  try { offres = await (await fetch((DANS_GOOGLE ? SITE : "") + "offres.json", { cache: "no-store" })).json(); } catch {}
  try { donnees = await serveur("accueil"); } catch (erreur) { donnees = { erreur: erreur.message || String(erreur) }; }

  if (offres) {
    const quand = new Date(offres.derniere_mise_a_jour);
    $("maj-offres").textContent = "Offres mises à jour le " + quand.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" })
      + " à " + quand.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }
  const nouvelles = offres ? offres.offres.filter(o => o.pertinente && o.premiere_vue === offres.derniere_mise_a_jour).length : "?";
  $("cartes").innerHTML =
    carte("c-bleu", "accueil", "Ma journée", "…", "Chargement") +
    carte("c-violet", "emploi", "Candidatures", String(donnees?.candidatures ?? "?"), `${nouvelles} nouvelle${nouvelles === 1 ? "" : "s"} offre${nouvelles === 1 ? "" : "s"} au dernier passage du robot`) +
    carte("c-vert", "social", "Social", "…", "Chargement") +
    carte("c-creme", "sante", "Santé", "", "Rappels et rendez-vous");
  $("cartes").onclick = e => { const b = e.target.closest("button[data-page]"); if (b && b.dataset.page !== "accueil") ouvrir(b.dataset.page); };

  if (donnees && !donnees.erreur) {
    const etats = donnees.parEtat || {};
    compteurs = { total: donnees.candidatures, envoyees: Object.entries(etats).filter(([etat]) => /envoy/i.test(etat)).reduce((n, [, v]) => n + v, 0) };
    envoyerCompteurs();
  }
  const file = donnees?.file || [];
  const prete = file.find(l => l.Etat === "Prêt");
  const enCours = file.filter(l => l.Etat === "En attente" || l.Etat === "En préparation").length;
  $("preparation").innerHTML = donnees?.erreur
    ? `<div><div class="petit">Candidatures</div><div class="titre">Données indisponibles</div><div class="petit">${echapper(donnees.erreur)}</div></div>`
    : prete
    ? `<div><div class="petit">Candidature prête</div><div class="titre">${echapper(prete.Entreprise)} · ${echapper(prete.Poste)}</div><div class="petit">${echapper(prete.Note)}</div></div>
       <div>${prete.CV ? `<a href="${echapper(prete.CV)}" target="_blank" rel="noopener">Ouvrir le CV</a>` : ""}${prete.Lettre ? `<a class="contour" href="${echapper(prete.Lettre)}" target="_blank" rel="noopener">Lettre</a>` : ""}</div>`
    : `<div><div class="petit">Candidatures</div><div class="titre">${enCours ? enCours + " en préparation" : "Rien en préparation"}</div>
       <div class="petit">Clique sur « Préparer ma candidature » dans Emploi.</div></div>`;
}

// Chiffres des candidatures transmis au module Emploi (il n'a pas d'accès direct au Google Sheet)
let compteurs = null;
function envoyerCompteurs() {
  if (compteurs && $("cadre-emploi").contentWindow) $("cadre-emploi").contentWindow.postMessage({ compteursCandidatures: compteurs }, "*");
}

// Messages du module Emploi : sa hauteur (pour éviter une barre de défilement en double) et ses bandeaux
window.addEventListener("message", e => {
  if (e.data && e.data.hauteurEmploi) {
    $("cadre-emploi").style.height = e.data.hauteurEmploi + "px";
    envoyerCompteurs();
  }
  if (e.data && e.data.message) {
    let bandeau = $("message");
    if (!bandeau) { bandeau = document.createElement("div"); bandeau.id = "message"; document.body.appendChild(bandeau); }
    bandeau.textContent = e.data.message;
    bandeau.classList.add("visible");
    clearTimeout(bandeau.minuteur);
    bandeau.minuteur = setTimeout(() => bandeau.classList.remove("visible"), 6000);
  }
});

// ---------- Ma journée ----------
function jourLocal(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
let decalage = 0, journeeActuelle = null, edition = false;
const dateChoisie = () => { const d = new Date(); d.setDate(d.getDate() - decalage); return jourLocal(d); };

function afficherJournee(j) {
  journeeActuelle = j;
  const h = j.habitudes;
  $("habitudes").innerHTML = h.length ? h.map(x => `
    <div class="ligne ${x.faite ? "faite" : ""}">
      <button class="case ${x.faite ? "cochee" : ""}" data-habitude="${echapper(x.nom)}" aria-label="${x.faite ? "Décocher" : "Cocher"} ${echapper(x.nom)}"></button>
      <span class="nom">${echapper(x.nom)}</span>
      ${edition ? `<button class="retirer" data-retirer="${echapper(x.nom)}" aria-label="Retirer ${echapper(x.nom)}">×</button>`
        : `<span class="points" title="14 derniers jours">${x.quinzaine.map(ok => `<i class="${ok ? "ok" : ""}"></i>`).join("")}</span>
           <span class="serie">${x.serie ? x.serie + " j d'affilée" : ""}</span>`}
    </div>`).join("") : `<div class="vide">Ajoute tes habitudes avec « Modifier mes habitudes ».</div>`;
  $("taches").innerHTML = j.taches.length ? j.taches.map(t => `
    <div class="ligne ${t.faite ? "faite" : ""}">
      <button class="case ${t.faite ? "cochee" : ""}" data-tache="${echapper(t.id)}" data-faite="${t.faite ? 1 : 0}" aria-label="Cocher ${echapper(t.titre)}"></button>
      <span class="nom">${echapper(t.titre)}</span>
      <button class="retirer" data-supprimer="${echapper(t.id)}" aria-label="Supprimer ${echapper(t.titre)}">×</button>
    </div>`).join("") : `<div class="vide">Rien à retenir pour l'instant.</div>`;
  // Carte « Ma journée » de l'accueil
  const faites = h.filter(x => x.faite).length, meilleure = h.reduce((m, x) => x.serie > (m?.serie || 0) ? x : m, null);
  const carteJour = document.querySelector('.carte[data-page="accueil"]');
  if (carteJour) carteJour.outerHTML = carte("c-bleu", "accueil", "Ma journée", h.length ? `${faites} / ${h.length}` : "0",
    meilleure ? `Meilleure série : ${echapper(meilleure.nom)}, ${meilleure.serie} j` : (h.length ? (decalage ? "hier" : "aujourd'hui") : "Ajoute tes habitudes"),
    h.length ? `<div class="jauge"><div style="width:${Math.round(100 * faites / h.length)}%"></div></div>` : "");
}

async function action(fonction, ...parametres) {
  try { afficherJournee(await serveur(fonction, ...parametres)); }
  catch (erreur) { afficherErreur("habitudes", erreur); }
}
const chargerJournee = () => action("journee", dateChoisie());

$("choix-jour").addEventListener("click", e => {
  const b = e.target.closest("button[data-decalage]");
  if (!b) return;
  decalage = Number(b.dataset.decalage);
  document.querySelectorAll("#choix-jour button").forEach(x => x.classList.toggle("actif", x === b));
  chargerJournee();
});
$("habitudes").addEventListener("click", e => {
  const c = e.target.closest("button[data-habitude]"), r = e.target.closest("button[data-retirer]");
  if (c) {
    const faite = !c.classList.contains("cochee");
    c.classList.toggle("cochee", faite); c.closest(".ligne").classList.toggle("faite", faite);  // affichage immédiat
    action("cocherHabitude", dateChoisie(), c.dataset.habitude, faite);
  }
  if (r && confirm(`Retirer « ${r.dataset.retirer} » de tes habitudes ? Son historique est gardé.`)) action("retirerHabitude", r.dataset.retirer, dateChoisie());
});
$("taches").addEventListener("click", e => {
  const c = e.target.closest("button[data-tache]"), s = e.target.closest("button[data-supprimer]");
  if (c) {
    const faite = c.dataset.faite !== "1";
    c.classList.toggle("cochee", faite); c.closest(".ligne").classList.toggle("faite", faite);
    action("cocherTache", c.dataset.tache, faite, jourLocal(new Date()));
  }
  if (s) action("supprimerTache", s.dataset.supprimer, dateChoisie());
});
$("gerer").addEventListener("click", () => {
  edition = !edition;
  $("ajout-habitude").hidden = !edition;
  $("gerer").textContent = edition ? "Terminé" : "Modifier mes habitudes";
  if (journeeActuelle) afficherJournee(journeeActuelle);
});
$("ajout-habitude").addEventListener("submit", e => {
  e.preventDefault();
  const nom = $("nouvelle-habitude").value.trim();
  if (nom) { $("nouvelle-habitude").value = ""; action("ajouterHabitude", nom, dateChoisie()); }
});
$("ajout-tache").addEventListener("submit", e => {
  e.preventDefault();
  const titre = $("nouvelle-tache").value.trim();
  if (titre) { $("nouvelle-tache").value = ""; action("ajouterTache", titre, jourLocal(new Date())); }
});

// ---------- Théâtre ----------
let donneesTheatre = null;
const dateFr = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : "";
function etoiles(p) {
  const note = Number(p.note) || 0;
  return `<span class="etoiles" aria-label="Note">${[1, 2, 3, 4, 5].map(n =>
    `<button class="${n <= note ? "pleine" : ""}" data-noter="${echapper(p.id)}" data-note="${n === note ? 0 : n}" aria-label="${n} sur 5">★</button>`).join("")}</span>`;
}
function afficherTheatre(d) {
  donneesTheatre = d;
  const par = statut => d.pieces.filter(p => p.statut === statut);
  const lieu = p => [p.lieu, p.jusqua ? "jusqu'au " + dateFr(p.jusqua) : ""].filter(Boolean).join(" · ");
  const aVoir = par("a_voir"), recos = par("reco"), vues = par("vue").sort((a, b) => (b.vue || "").localeCompare(a.vue || ""));
  $("nb-a-voir").textContent = aVoir.length ? aVoir.length + " pièce" + (aVoir.length > 1 ? "s" : "") : "";
  $("nb-vues").textContent = vues.length ? String(vues.length) : "";
  $("a-voir").innerHTML = aVoir.length ? aVoir.map(p => `<div class="piece">
      <span class="titre-idee">${echapper(p.titre)}</span>${lieu(p) ? `<span class="detail-contact">${echapper(lieu(p))}</span>` : ""}
      <div class="actions-idee"><button class="petit-bouton" data-vue="${echapper(p.id)}">Je l'ai vue</button>
        ${p.lien ? `<a href="${echapper(p.lien)}" target="_blank" rel="noopener">Réserver</a>` : ""}
        <button class="retirer" data-supprimer-piece="${echapper(p.id)}" aria-label="Retirer">×</button></div></div>`).join("")
    : `<div class="vide">Ajoute une pièce, ou garde une recommandation de Claude.</div>`;
  $("recos").innerHTML = recos.length ? recos.map(p => `<div class="piece reco">
      <span class="titre-idee">${echapper(p.titre)}</span>${lieu(p) ? `<span class="detail-contact">${echapper(lieu(p))}</span>` : ""}
      ${p.pourquoi ? `<span class="pourquoi">${echapper(p.pourquoi)}</span>` : ""}
      <div class="actions-idee"><button class="petit-bouton" data-garder="${echapper(p.id)}">Ajouter à ma liste</button>
        <button class="petit-bouton" data-ecarter="${echapper(p.id)}">Pas pour moi</button>
        ${p.lien ? `<a href="${echapper(p.lien)}" target="_blank" rel="noopener">Voir</a>` : ""}</div></div>`).join("")
    : `<div class="vide">Claude propose de nouvelles pièces le 1er et le 15 de chaque mois, d'après celles que tu as aimées.</div>`;
  $("vues").innerHTML = vues.length ? vues.map(p => `<div class="ligne">
      <span class="nom">${echapper(p.titre)}${p.vue ? `<br><span class="detail-contact">Vue le ${dateFr(p.vue)}</span>` : ""}</span>
      ${etoiles(p)}<button class="retirer" data-supprimer-piece="${echapper(p.id)}" aria-label="Retirer">×</button></div>`).join("")
    : `<div class="vide">Aucune pièce pour l'instant.</div>`;
}
async function actionTheatre(fonction, ...parametres) {
  try { afficherTheatre(await serveur(fonction, ...parametres, jourLocal(new Date()))); }
  catch (erreur) { afficherErreur("a-voir", erreur); }
}
const chargerTheatre = () => actionTheatre("theatre");
$("vue-theatre").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const aujourdhui = jourLocal(new Date());
  if (b.dataset.vue) actionTheatre("changerPiece", b.dataset.vue, { statut: "vue", vue: aujourdhui });
  if (b.dataset.garder) actionTheatre("changerPiece", b.dataset.garder, { statut: "a_voir" });
  if (b.dataset.ecarter) actionTheatre("changerPiece", b.dataset.ecarter, { statut: "ecartee" });
  if (b.dataset.noter) actionTheatre("changerPiece", b.dataset.noter, { note: b.dataset.note === "0" ? "" : b.dataset.note });
  if (b.dataset.supprimerPiece && confirm("Retirer cette pièce de ta liste ?")) actionTheatre("supprimerPiece", b.dataset.supprimerPiece);
});
$("ajout-piece").addEventListener("submit", e => {
  e.preventDefault();
  const titre = $("titre-piece").value.trim();
  if (!titre) return;
  const statut = $("statut-piece").value;
  actionTheatre("ajouterPiece", { titre, statut, vue: statut === "vue" ? jourLocal(new Date()) : "" });
  $("titre-piece").value = "";
});

$("choix-social").addEventListener("click", e => {
  const b = e.target.closest("button[data-vue]");
  if (!b) return;
  document.querySelectorAll("#choix-social button").forEach(x => x.classList.toggle("actif", x === b));
  ["personnes", "sorties"].forEach(v => $("vue-" + v).hidden = b.dataset.vue !== v);
});

// ---------- Social ----------
const CATEGORIES = { "Culture": "c-violet", "Plein air": "c-vert", "Restaurants": "c-creme", "Sport": "c-bleu", "Soirée": "c-rose", "Balade": "c-vert", "Autre": "c-bleu" };
$("categorie-activite").innerHTML = Object.keys(CATEGORIES).map(c => `<option>${c}</option>`).join("");
// Idées de départ : des classiques parisiens, à supprimer ou compléter librement
const IDEES_DE_DEPART = [
  { titre: "Pique-nique au bord du canal Saint-Martin", categorie: "Plein air", lieu: "Paris 10e" },
  { titre: "Coucher de soleil aux Buttes-Chaumont", categorie: "Plein air", lieu: "Paris 19e" },
  { titre: "Nocturne du jeudi au musée d'Orsay", categorie: "Culture", lieu: "Paris 7e" },
  { titre: "Concert à la Philharmonie de Paris", categorie: "Culture", lieu: "Paris 19e" },
  { titre: "Expo à la Fondation Louis Vuitton", categorie: "Culture", lieu: "Bois de Boulogne" },
  { titre: "Déjeuner au marché des Enfants-Rouges", categorie: "Restaurants", lieu: "Paris 3e" },
  { titre: "Brunch puis balade dans le Marais", categorie: "Restaurants", lieu: "Paris 3e-4e" },
  { titre: "Balade sur la Coulée verte René-Dumont", categorie: "Balade", lieu: "Paris 12e" },
  { titre: "Chiner aux puces de Saint-Ouen", categorie: "Balade", lieu: "Saint-Ouen" },
  { titre: "Séance de bloc en salle d'escalade", categorie: "Sport", lieu: "" },
  { titre: "Verre en terrasse au bord de la Seine", categorie: "Soirée", lieu: "" },
  { titre: "Cinéma en plein air à La Villette (l'été)", categorie: "Culture", lieu: "Paris 19e" },
];
let donneesSocial = null, categorieChoisie = "";
const initiales = nom => nom.split(/\s+/).map(m => m[0]).join("").slice(0, 2).toUpperCase();
function texteContact(c) {
  if (!c.frequence) return c.dernier ? `Contacté le ${new Date(c.dernier + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}` : "À contacter, une fois";
  if (c.ecart === null || c.ecart === undefined) return "Pas encore de contact noté";
  const quand = c.ecart === 0 ? "aujourd'hui" : c.ecart === 1 ? "hier" : `il y a ${c.ecart} j`;
  return `Dernier contact ${quand} · tous les ${c.frequence} j`;
}

function afficherSocial(d) {
  donneesSocial = d;
  const aRelancer = d.contacts.filter(c => c.retard >= 0).length;
  $("nb-relances").textContent = aRelancer ? String(aRelancer) : "";
  $("contacts").innerHTML = d.contacts.length ? d.contacts.map(c => {
    const prevues = d.activites.filter(a => a.avec === c.nom && !a.faite);
    const activite = c.note?.trim() || "";
    return `<div class="personne">
      <div class="haut"><span class="initiales">${echapper(initiales(c.nom))}</span>
        <div><div class="nom-personne">${echapper(c.nom)}</div><div class="detail-contact">${texteContact(c)}</div></div>
        ${c.retard >= 0 ? `<span class="badge-relance">${c.frequence ? "À relancer" : "À contacter"}</span>`
          : `<span class="badge-relance badge-ok">${c.frequence ? "dans " + (-c.retard) + " j" : "Fait"}</span>`}</div>
      <div class="rangee">Activité :
        <button class="activite ${activite ? "" : "vide-activite"}" data-activite="${echapper(c.nom)}" data-frequence="${c.frequence}">${activite ? echapper(activite) : "+ ajouter"}</button></div>
      ${prevues.map(a => `<div class="prevue">Prévu ensemble : ${echapper(a.titre)}${a.quand ? " · " + echapper(a.quand) : ""}</div>`).join("")}
      <div class="actions-idee">
        ${c.frequence || c.retard >= 0 ? `<button class="petit-bouton" data-contacte="${echapper(c.nom)}">Contacté</button>` : ""}
        <button class="retirer" data-supprimer-contact="${echapper(c.nom)}" aria-label="Supprimer ${echapper(c.nom)}">×</button>
      </div></div>`;
  }).join("") : `<div class="vide">Ajoute les personnes que tu veux voir ou recontacter, et l'activité à faire ensemble.</div>`;

  const categories = [...new Set(d.activites.map(a => a.categorie))];
  $("categories").innerHTML = ["", ...categories, "Théâtre"].map(c =>
    `<button data-categorie="${echapper(c)}" class="${c === categorieChoisie ? "actif" : ""}">${c ? echapper(c) : "Toutes"}</button>`).join("");
  const theatre = categorieChoisie === "Théâtre";
  $("vue-theatre").hidden = !theatre;
  $("activites").hidden = theatre;
  $("ajout-activite").closest("details").hidden = theatre;
  const visibles = d.activites.filter(a => !categorieChoisie || a.categorie === categorieChoisie);
  const idee = a => `<div class="idee">
      <span class="cat ${CATEGORIES[a.categorie] || "c-bleu"}">${echapper(a.categorie)}</span>
      <span class="titre-idee">${echapper(a.titre)}</span>
      ${a.lieu || a.quand ? `<span class="detail-contact">${echapper([a.lieu, a.quand].filter(Boolean).join(" · "))}</span>` : ""}
      <div class="actions-idee">
        <select class="avec ${a.avec ? "choisi" : ""}" data-avec="${echapper(a.id)}" aria-label="Avec qui ?">
          <option value="">Avec qui ?</option>${d.contacts.map(c => `<option ${c.nom === a.avec ? "selected" : ""}>${echapper(c.nom)}</option>`).join("")}
        </select>
        <button class="petit-bouton" data-faite="${echapper(a.id)}" data-etat="${a.faite ? 1 : 0}">${a.faite ? "Refaire" : "C'est fait"}</button>
        ${a.lien ? `<a href="${echapper(a.lien)}" target="_blank" rel="noopener">Voir</a>` : ""}
        <button class="retirer" data-supprimer-activite="${echapper(a.id)}" aria-label="Supprimer">×</button>
      </div></div>`;
  const aFaire = visibles.filter(a => !a.faite), faites = visibles.filter(a => a.faite);
  $("activites").innerHTML = d.activites.length
    ? (aFaire.length ? `<div class="idees">${aFaire.map(idee).join("")}</div>` : `<div class="vide">Toutes les idées de cette catégorie sont faites.</div>`)
      + (faites.length ? `<details class="faites"><summary>Déjà faites (${faites.length})</summary><div class="idees">${faites.map(idee).join("")}</div></details>` : "")
    : `<div class="vide">Aucune idée pour l'instant. <button class="lien" id="idees-depart">Ajouter des idées de départ</button></div>`;
  majCarteSocial();
}

function majCarteSocial() {
  const carteSocial = document.querySelector('.carte[data-page="social"]');
  if (!carteSocial || !donneesSocial) return;
  const enRetard = donneesSocial.contacts.filter(c => c.retard >= 0);
  carteSocial.outerHTML = carte("c-vert", "social", "Social",
    enRetard.length ? `${enRetard.length} à relancer` : (donneesSocial.contacts.length ? "À jour" : "0"),
    enRetard.length ? `En premier : ${echapper(enRetard[0].nom)}` : (donneesSocial.contacts.length ? "Personne à relancer" : "Ajoute tes proches"));
}

async function actionSocial(fonction, ...parametres) {
  try { afficherSocial(await serveur(fonction, ...parametres, jourLocal(new Date()))); }
  catch (erreur) { afficherErreur("contacts", erreur); }
}
const chargerSocial = () => actionSocial("social");

$("contacts").addEventListener("click", e => {
  const c = e.target.closest("[data-contacte]"), s = e.target.closest("[data-supprimer-contact]");
  const a = e.target.closest("[data-activite]");
  if (a) {
    const actuelle = a.classList.contains("vide-activite") ? "" : a.textContent.trim();
    const nouvelle = prompt(`Activité avec ${a.dataset.activite} (ex. running, ciné, verre) :`, actuelle);
    if (nouvelle !== null && nouvelle.trim() !== actuelle) actionSocial("ajouterContact", a.dataset.activite, a.dataset.frequence, nouvelle.trim() || " ");
    return;
  }
  if (c) actionSocial("contacte", c.dataset.contacte);
  if (s && confirm(`Retirer ${s.dataset.supprimerContact} de ta liste ?`)) actionSocial("supprimerContact", s.dataset.supprimerContact);
});
$("activites").addEventListener("click", e => {
  const f = e.target.closest("[data-faite]"), s = e.target.closest("[data-supprimer-activite]");
  if (f) actionSocial("activiteFaite", f.dataset.faite, f.dataset.etat !== "1");
  if (s) actionSocial("supprimerActivite", s.dataset.supprimerActivite);
  if (e.target.id === "idees-depart") actionSocial("ajouterActivites", IDEES_DE_DEPART);
});
$("plus-idees").addEventListener("click", async () => {
  const theatre = categorieChoisie === "Théâtre";
  const commande = theatre ? "/sorties théâtre" : "/sorties" + (categorieChoisie ? " " + categorieChoisie.toLowerCase() : "");
  let copie = true;
  try { await navigator.clipboard.writeText(commande); } catch { copie = false; }
  const message = copie ? `Commande « ${commande} » copiée : colle-la dans ta conversation Claude. Tu peux ajouter une envie, ex. « ce week-end, en extérieur ».`
    : `Tape « ${commande} » dans ta conversation Claude.`;
  let bandeau = $("message");
  if (!bandeau) { bandeau = document.createElement("div"); bandeau.id = "message"; document.body.appendChild(bandeau); }
  bandeau.textContent = message; bandeau.classList.add("visible");
  clearTimeout(bandeau.minuteur); bandeau.minuteur = setTimeout(() => bandeau.classList.remove("visible"), 8000);
});

$("activites").addEventListener("change", e => {
  const choix = e.target.closest("select[data-avec]");
  if (choix) actionSocial("lierActivite", choix.dataset.avec, choix.value);
});
$("categories").addEventListener("click", e => {
  const b = e.target.closest("[data-categorie]");
  if (b) { categorieChoisie = b.dataset.categorie; afficherSocial(donneesSocial); }
});
$("ajout-contact").addEventListener("submit", e => {
  e.preventDefault();
  const nom = $("nom-contact").value.trim();
  if (nom) {
    actionSocial("ajouterContact", nom, $("frequence-contact").value, $("activite-contact").value.trim());
    $("ajout-contact").closest("details").open = false;
    $("nom-contact").value = ""; $("activite-contact").value = "";
  }
});
$("ajout-activite").addEventListener("submit", e => {
  e.preventDefault();
  const titre = $("titre-activite").value.trim();
  if (!titre) return;
  actionSocial("ajouterActivites", [{ titre, categorie: $("categorie-activite").value, lieu: $("lieu-activite").value.trim() }]);
  $("ajout-activite").closest("details").open = false;
  $("titre-activite").value = ""; $("lieu-activite").value = "";
});

const depart = (location.hash || "").slice(1);
ouvrir(MODULES.some(m => m.id === depart) ? depart : "accueil");
chargerAccueil().then(chargerJournee).then(() => serveur("social", jourLocal(new Date())).then(d => { donneesSocial = d; majCarteSocial(); }).catch(() => {}));
</script>
</body>
</html>
